<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Fora de Forma do Milhão — Bolão Mega-Sena & Lotofácil</title>

<style>
  :root{
    --bg:#0A1326; --panel:#121B30; --card:#16213A; --inp:#0E1626;
    --line:#26324C; --text:#EAF0FB; --mut:#8A97B0; --mutHi:#B6C2D9;
    --gold:#F4C84A; --gold2:#E8A21C; --goldHi:#FFF3B0; --goldInk:#3A2702;
    --amber:#F2A93B; --red:#E76A82;
    --accent:#00A85A; --accentHi:#43E08A; --accentInk:#04130C;     /* trocado por jogo */
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overscroll-behavior:none;overflow-x:hidden}
  body{background:
      radial-gradient(1100px 440px at 50% -170px, rgba(244,200,74,.16), transparent 70%),
      radial-gradient(720px 320px at 50% -120px, color-mix(in srgb,var(--accent) 13%, transparent), transparent 72%),
      var(--bg);
    color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
  #root{position:relative;z-index:1}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center}

  .badge{background:linear-gradient(180deg,var(--goldHi),var(--gold2));color:var(--goldInk);font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.16em;padding:4px 8px;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px rgba(244,200,74,.25)}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
  .sub{color:var(--mut);font-size:13px;margin:6px 0 0;line-height:1.4}
  .row{display:flex;align-items:center}.gap8{gap:8px}.gap12{gap:12px}.between{justify-content:space-between}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--mutHi);font:600 14px var(--sans);padding:7px 16px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button[aria-selected="true"]{background:var(--accent);color:var(--accentInk)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .p16{padding:16px}.p12{padding:12px}.p20{padding:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label.fld{display:block}
  .fld .lab{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:6px}
  input,select{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;font-size:16px;font-family:var(--sans)}
  input.mono{font-family:var(--mono)}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .hint{color:var(--mut);font-size:12px;line-height:1.45}.hint b{color:var(--mutHi)}

  .btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mutHi);font:700 15px var(--sans);padding:12px 16px;border-radius:11px;cursor:pointer;transition:.12s}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
  .btn.primary:disabled{background:var(--card);color:var(--mut);border-color:var(--line);cursor:not-allowed}
  .btn.full{width:100%}.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .link{background:none;border:0;color:var(--accentHi);font:600 14px var(--sans);cursor:pointer}
  .msg{font-size:13px;margin:10px 0 0;line-height:1.45}.msg.err{color:var(--red)}.msg.ok{color:var(--accentHi)}

  .vtop{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px}
  .vtop .ttl{color:var(--mut);font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.14em}
  .vcount{font:800 12px var(--mono)}
  .volante{display:grid;gap:6px}
  .cell{aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--mutHi);border-radius:8px;font:800 13px var(--mono);cursor:pointer;transition:background .12s,color .12s,border-color .12s;padding:0}
  .cell:active{background:#1c3a2b}
  .cell.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
  .cell:disabled{opacity:.4;cursor:not-allowed}
  @media(max-width:420px){.volante{gap:4px}.cell{font-size:12px}}

  .resHead{display:flex;justify-content:space-between;align-items:center}
  .aval{font-size:24px;font-weight:800;margin:2px 0 0}
  .eyebrow{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin:0}
  .ring{position:relative;width:64px;height:64px;flex:none}.ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font:800 17px var(--mono);line-height:1}.ring .num span{color:var(--mut);font-size:9px;margin-top:2px}

  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

  .chip .k{font-size:12px;color:var(--mutHi);display:flex;align-items:center;gap:6px;min-width:0}
  .chip .k .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .mk{font-weight:800;flex:none}.chip .v{font:800 12px var(--mono);flex:none}

  .sugbox{background:#1E160A;border:1px solid rgba(242,169,59,.25);border-radius:10px;padding:12px;margin-top:14px}
  .sugbox .t{color:var(--amber);font:700 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;margin:0}
  .sugbox ul{margin:8px 0 0;padding:0;list-style:none}
  .sugbox li{color:var(--mutHi);font-size:14px;line-height:1.5;margin-bottom:6px;padding-left:16px;position:relative}
  .sugbox li::before{content:"•";color:var(--amber);position:absolute;left:2px}
  .okmsg{color:var(--accentHi);font-size:14px;margin:12px 0 0}

  .fechado{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
  .fechado .big{font:800 22px var(--mono);color:var(--accentHi)}
  .fechado .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em}

  .grp{overflow:hidden;margin-top:14px}
  .grpHead{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .grpHead .d{font-weight:700;font-size:14px}
  .jrow{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line)}
  .jrow:first-child{border-top:0}
  .jrow .nm{font-size:13px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jrow .dz{font:700 14px var(--mono);color:var(--accentHi);letter-spacing:.06em;margin:2px 0 0;word-break:break-word}
  .jrow .tag{font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mut)}
  .jrow .rm{background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer;flex:none}
  .empty{text-align:center;padding:24px}.empty .big2{color:var(--mutHi);font-size:14px}.empty .small{color:var(--mut);font-size:12px;margin-top:4px}

  .pend{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
  .pend:first-child{border-top:0}
  .pend .nm{font-size:14px;font-weight:700;margin:0}.pend .em{color:var(--mut);font-size:12px;margin:2px 0 0}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .stack>*+*{margin-top:16px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

  /* ===== TEMA "DO MILHÃO" — nome dourado + moedas no fundo ===== */
  .brandWrap{display:flex;flex-direction:column;align-items:center;text-align:center}
  .brandSvg{display:block;width:min(380px,82vw);height:auto;overflow:visible;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.5)) drop-shadow(0 10px 24px rgba(244,200,74,.22));}
  .brand-sm .brandSvg{width:min(244px,64vw)}
  .brandWrap .tag{color:var(--gold);font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;margin:11px 0 0;opacity:.92}
  .brandWrap .tag{color:var(--gold);font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;margin:7px 0 0;opacity:.9}
  #coins{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .coin{position:absolute;top:-50px;width:var(--sz,26px);height:var(--sz,26px);opacity:0;
    background:center/contain no-repeat url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><radialGradient id='c' cx='37%25' cy='30%25' r='78%25'><stop offset='0' stop-color='%23FFF6C0'/><stop offset='52%25' stop-color='%23F4C84A'/><stop offset='100%25' stop-color='%23A86E08'/></radialGradient></defs><circle cx='20' cy='20' r='18' fill='url(%23c)' stroke='%237a4f05' stroke-width='1.4'/><circle cx='20' cy='20' r='13' fill='none' stroke='%23FFF6C0' stroke-width='1' opacity='.45'/><text x='20' y='26.5' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='15' fill='%237a4f05'>R%24</text></svg>");
    animation:coinFall var(--dur,15s) linear var(--del,0s) infinite;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
  @keyframes coinFall{0%{transform:translateY(-50px) rotate(0) scaleX(1);opacity:0}
    8%{opacity:.42} 50%{transform:translateY(46vh) rotate(240deg) scaleX(.65)}
    92%{opacity:.34} 100%{transform:translateY(105vh) rotate(460deg) scaleX(1);opacity:0}}
  @media (prefers-reduced-motion: reduce){.coin{animation:none;opacity:.2}}
</style>
</head>

const POP_LOTO={1:544.9,2:538.3,3:550.7,4:521.6,5:557.0,6:519.7,7:538.7,8:538.4,9:528.9,10:531.8,11:513.9,12:541.6,13:546.8,14:532.4,15:531.9,16:508.5,17:545.7,18:536.9,19:536.8,20:518.6,21:519.0,22:532.5,23:543.7,24:536.2,25:549.8};

  }
};

/* ---------------- utils ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const p2=n=>String(n).padStart(2,"0");
const inR=(x,a,b)=>x>=a&&x<=b;
const sum=a=>a.reduce((x,y)=>x+y,0);
function popVar(arr){const m=sum(arr)/arr.length;return arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length;}
function comb(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return Math.round(r);}
function brl(v){return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function iso(d){return d.toISOString().slice(0,10);}
function nextDraw(dias){const d=new Date();d.setHours(0,0,0,0);for(let i=0;i<8;i++){if(dias.includes(d.getDay()))return iso(d);d.setDate(d.getDate()+1);}return iso(d);}
function fmtBR(s){if(!s)return"";const[y,m,dd]=s.split("-");const dd_=["dom","seg","ter","qua","qui","sex","sáb"];return dd+"/"+m+" ("+dd_[new Date(s+"T12:00:00").getDay()]+")";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1700);}
function copyText(txt){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>toast("Copiado")).catch(fb);}else fb();function fb(){const ta=el("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado");}catch(e){toast("Copie manualmente");}document.body.removeChild(ta);}}
function setAccent(g){const r=document.documentElement.style;r.setProperty("--accent",g.accent);r.setProperty("--accentHi",g.accentHi);r.setProperty("--accentInk",g.ink);}
const avalColor=a=>a==="MESTRE"?"var(--accentHi)":a==="BOM"?"var(--accent)":a==="FRACO"?"var(--amber)":"var(--red)";
const scoreColor=s=>s>=85?"var(--accentHi)":s>=70?"var(--accent)":s>=55?"var(--amber)":"var(--red)";
function ringEl(score){const r=26,c=2*Math.PI*r,off=c*(1-score/100),col=scoreColor(score);const w=el("div","ring");w.innerHTML=`<svg width="64" height="64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg><div class="num"><b style="color:${col}">${score}</b><span>/100</span></div>`;return w;}
function node(h){const t=el("div");t.innerHTML=h.trim();return t.firstChild;}
const avalDe=s=>s>=85?"MESTRE":s>=70?"BOM":s>=55?"FRACO":"RUIM";

/* ---------------- VALIDADOR MEGA-SENA (base 6) ---------------- */
function analyzeMega(nums,L){
  const g=[...nums].sort((a,b)=>a-b),qt=g.length,k=qt/6,r=Math.round;
  const soma=sum(g),pares=g.filter(n=>n%2===0).length;
  const t1=g.filter(n=>n<=20).length,t2=g.filter(n=>n>=21&&n<=40).length,t3=g.filter(n=>n>=41).length;
  const fa={};g.forEach(n=>{const f=Math.floor((n-1)/10);fa[f]=(fa[f]||0)+1;});const linhas=Math.max(...Object.values(fa));
  const te={};g.forEach(n=>{const t=n%10;te[t]=(te[t]||0)+1;});const cols=Math.max(...Object.values(te));
  const repet=g.filter(n=>L.ultimo.includes(n)).length, nAtras=g.filter(n=>L.atrasadas.includes(n)).length;
  const nQuent=g.filter(n=>L.quentes.includes(n)).length, nFrias=g.filter(n=>L.frias.includes(n)).length;
  const pop=Math.round(g.reduce((a,n)=>a+(POP_MEGA[n]||0),0)*10)/10;
  const distMed=Math.round(((g[g.length-1]-g[0])/5)*10)/10;
  const ieg=Math.round((popVar(g.map(n=>Math.floor(n/10)))+popVar(g.map(n=>n%10)))*10)/10;
  // faixas ideais escalam com a qtd de dezenas (qt=6 reproduz exatamente o jogo base)
  const I={somaMin:r(100*k),somaMax:r(265*k),paresMin:r(qt*0.34),paresMax:r(qt*0.66),
    tMin:Math.max(1,r(qt*0.167)),tMax:r(qt*0.5),linhasMax:Math.max(3,Math.ceil(qt/2)),colsMax:Math.max(2,Math.ceil(qt/3)),
    repetMax:Math.max(1,r(qt/6)),quentMin:Math.max(1,r(qt*0.167)),quentMax:r(qt*0.5),friasMax:Math.max(3,r(qt/2)),
    popGood:r(650*k),popOk:r(850*k)};
  let s=0;
  s+=inR(soma,I.somaMin,I.somaMax)?15:0;s+=inR(pares,I.paresMin,I.paresMax)?15:0;
  s+=inR(t1,I.tMin,I.tMax)?4:0;s+=inR(t2,I.tMin,I.tMax)?4:0;s+=inR(t3,I.tMin,I.tMax)?4:0;
  s+=linhas<=I.linhasMax?5:0;s+=cols<=I.colsMax?5:0;s+=repet<=I.repetMax?8:0;
  s+=nAtras>=1?5:0;s+=inR(nQuent,I.quentMin,I.quentMax)?5:0;s+=nFrias<=I.friasMax?5:0;
  s+=pop<=I.popGood?15:(pop<=I.popOk?7:0);s+=inR(distMed,5,12)?5:0;s+=ieg>=4?5:0;
  const checks=[
    ["Soma",soma,inR(soma,I.somaMin,I.somaMax)],["Pares/ímpares",pares+"/"+(qt-pares),inR(pares,I.paresMin,I.paresMax)],
    ["Números baixos (1–20)",t1,inR(t1,I.tMin,I.tMax)],["Números do meio (21–40)",t2,inR(t2,I.tMin,I.tMax)],["Números altos (41–60)",t3,inR(t3,I.tMin,I.tMax)],
    ["Concentração",linhas,linhas<=I.linhasMax],["Mesmo final",cols,cols<=I.colsMax],["Repete sorteio passado",repet,repet<=I.repetMax],
    ["Há muito sem sair",nAtras,nAtras>=1],["Em alta",nQuent,inR(nQuent,I.quentMin,I.quentMax)],["Saem pouco",nFrias,nFrias<=I.friasMax],
    ["Concorrência",pop,pop<=I.popGood],["Distância",distMed,inR(distMed,5,12)],["Equilíbrio",ieg,ieg>=4]];
  return {g,qt,soma,pares,t1,t2,t3,linhas,cols,repet,nAtras,nQuent,nFrias,pop,distMed,I,score:s,aval:avalDe(s),checks};
}
function suggestMega(a,L){
  const o=[],g=a.g,I=a.I,odds=g.filter(n=>n%2),evens=g.filter(n=>!(n%2));
  const livre=f=>Object.keys(POP_MEGA).map(Number).filter(n=>!g.includes(n)&&(f?f(n):1)).sort((x,y)=>POP_MEGA[x]-POP_MEGA[y]);
  const ex=a=>a.length?a[0]:null;
  if(a.pares<I.paresMin){const t=ex(livre(n=>!(n%2)));o.push("Poucos pares. Troque um ímpar (ex.: "+odds[odds.length-1]+")"+(t?" por um par como "+t:"")+".");}
  if(a.pares>I.paresMax){const t=ex(livre(n=>n%2));o.push("Pares demais. Troque um par (ex.: "+evens[evens.length-1]+")"+(t?" por um ímpar como "+t:"")+".");}
  if(a.soma<I.somaMin)o.push("A soma ficou baixa ("+a.soma+"). O ideal aqui é "+I.somaMin+" a "+I.somaMax+" — troque um número pequeno por um maior.");
  if(a.soma>I.somaMax)o.push("A soma ficou alta ("+a.soma+"). O ideal aqui é "+I.somaMin+" a "+I.somaMax+" — troque um número grande por um menor.");
  if(a.t1===0){const t=ex(livre(n=>n<=20));o.push("Faltou número baixo (1–20). Inclua um"+(t?", como o "+t:"")+".");}
  if(a.t3===0){const t=ex(livre(n=>n>=41));o.push("Faltou número alto (41–60). Inclua um"+(t?", como o "+t:"")+".");}
  if(a.repet>I.repetMax){const r=g.filter(n=>L.ultimo.includes(n));o.push("Você repetiu "+a.repet+" do sorteio passado ("+r.join(", ")+"). O ideal é no máximo "+I.repetMax+" — troque algum.");}
  if(a.nFrias>I.friasMax)o.push("Vários números que quase não saem ("+a.nFrias+"). Deixe no máximo "+I.friasMax+" — troque 1 ou 2 por mais comuns.");
  if(a.nQuent<I.quentMin)o.push("Poucos números em alta. Incluir 1 ou 2 dá equilíbrio.");
  if(a.nAtras===0){const l=L.atrasadas.filter(n=>!g.includes(n)).slice(0,4);o.push("Vale incluir 1 que está há muito sem sair"+(l.length?", como "+l.join(", "):"")+".");}
  if(a.pop>I.popGood){const mp=[...g].sort((x,y)=>POP_MEGA[y]-POP_MEGA[x])[0],t=ex(livre());o.push("Muita gente joga nesses números — trocar o "+mp+" pelo "+t+" reduz a divisão do prêmio.");}
  return o;
}

/* ---------------- VALIDADOR LOTOFÁCIL (base 15, volante 5×5) ---------------- */
const LF_PRIMOS=[2,3,5,7,11,13,17,19,23], LF_MULT3=[3,6,9,12,15,18,21,24], LF_MOLDURA=[1,2,3,4,5,6,10,11,15,16,20,21,22,23,24,25];
function analyzeLoto(nums,L){
  const g=[...nums].sort((a,b)=>a-b),qt=g.length,k=qt/15,rd=Math.round;
  const soma=sum(g),pares=g.filter(n=>n%2===0).length;
  const rr={};g.forEach(n=>{const r=Math.floor((n-1)/5);rr[r]=(rr[r]||0)+1;});const linhas=Math.max(...Object.values(rr));
  const cc={};g.forEach(n=>{const c=(n-1)%5;cc[c]=(cc[c]||0)+1;});const cols=Math.max(...Object.values(cc));
  const repet=g.filter(n=>L.ultimo.includes(n)).length;
  let cons=0;for(let i=0;i<g.length-1;i++)if(g[i+1]===g[i]+1)cons++;
  const nAtras=g.filter(n=>L.atrasadas.includes(n)).length;
  const nQuent=g.filter(n=>L.quentes.includes(n)).length, nFrias=g.filter(n=>L.frias.includes(n)).length;
  const primos=g.filter(n=>LF_PRIMOS.includes(n)).length, mult3=g.filter(n=>LF_MULT3.includes(n)).length;
  const moldura=g.filter(n=>LF_MOLDURA.includes(n)).length;
  const pop=Math.round(g.reduce((a,n)=>a+(POP_LOTO[n]||0),0)*10)/10;
  // faixas ideais escalam com a qtd de dezenas (qt=15 reproduz exatamente o jogo base)
  const I={somaMin:rd(161*k),somaMax:rd(220*k),paresMin:rd(qt*0.4),paresMax:rd(qt*0.6),
    linhasMax:Math.max(4,Math.ceil(qt/4)),colsMax:Math.max(4,Math.ceil(qt/4)),repetMin:rd(8*k),repetMax:rd(10*k),
    consMax:Math.max(7,rd(7*k)),quentMin:rd(3*k),quentMax:rd(7*k),friasMax:rd(4*k),popGood:rd(7900*k),popOk:rd(8200*k),
    primosMin:rd(4*k),primosMax:rd(7*k),mult3Min:rd(3*k),mult3Max:rd(6*k),molduraMin:rd(7*k),molduraMax:rd(12*k)};
  let s=0;
  s+=inR(soma,I.somaMin,I.somaMax)?15:0;s+=inR(pares,I.paresMin,I.paresMax)?15:0;
  s+=linhas<=I.linhasMax?5:0;s+=cols<=I.colsMax?5:0;s+=inR(repet,I.repetMin,I.repetMax)?10:0;s+=cons<=I.consMax?5:0;
  s+=nAtras>=1?5:0;s+=inR(nQuent,I.quentMin,I.quentMax)?5:0;s+=nFrias<=I.friasMax?5:0;
  s+=pop<=I.popGood?15:(pop<=I.popOk?7:0);
  s+=inR(primos,I.primosMin,I.primosMax)?5:0;s+=inR(mult3,I.mult3Min,I.mult3Max)?5:0;s+=inR(moldura,I.molduraMin,I.molduraMax)?5:0;
  const checks=[
    ["Soma",soma,inR(soma,I.somaMin,I.somaMax)],["Pares/ímpares",pares+"/"+(qt-pares),inR(pares,I.paresMin,I.paresMax)],
    ["Repete sorteio passado",repet,inR(repet,I.repetMin,I.repetMax)],["Concorrência",pop,pop<=I.popGood],
    ["Concentração (linha)",linhas,linhas<=I.linhasMax],["Mesma coluna",cols,cols<=I.colsMax],
    ["Sequências",cons,cons<=I.consMax],["Há muito sem sair",nAtras,nAtras>=1],
    ["Em alta",nQuent,inR(nQuent,I.quentMin,I.quentMax)],["Saem pouco",nFrias,nFrias<=I.friasMax],
    ["Primos",primos,inR(primos,I.primosMin,I.primosMax)],["Múltiplos de 3",mult3,inR(mult3,I.mult3Min,I.mult3Max)],
    ["Bordas do volante",moldura,inR(moldura,I.molduraMin,I.molduraMax)]];
  return {g,qt,soma,pares,linhas,cols,repet,cons,nAtras,nQuent,nFrias,primos,mult3,moldura,pop,I,score:s,aval:avalDe(s),checks};
}
function suggestLoto(a,L){
  const o=[],g=a.g,I=a.I;
  const livre=f=>Object.keys(POP_LOTO).map(Number).filter(n=>!g.includes(n)&&(f?f(n):1)).sort((x,y)=>POP_LOTO[x]-POP_LOTO[y]);
  const ex=a=>a.length?a[0]:null;
  if(!inR(a.repet,I.repetMin,I.repetMax)){
    if(a.repet<I.repetMin){const faltam=L.ultimo.filter(n=>!g.includes(n)).slice(0,5);o.push("Você repetiu só "+a.repet+" números do último sorteio. O ideal aqui é "+I.repetMin+" a "+I.repetMax+" — inclua alguns destes que saíram: "+faltam.join(", ")+".");}
    else o.push("Você repetiu "+a.repet+" do último sorteio (muito). O ideal aqui é "+I.repetMin+" a "+I.repetMax+" — troque 1 ou 2 por números que não saíram.");
  }
  if(a.soma<I.somaMin)o.push("A soma ficou baixa ("+a.soma+"). O ideal aqui é "+I.somaMin+" a "+I.somaMax+" — troque um número pequeno por um maior.");
  if(a.soma>I.somaMax)o.push("A soma ficou alta ("+a.soma+"). O ideal aqui é "+I.somaMin+" a "+I.somaMax+" — troque um número grande por um menor.");
  if(a.pares<I.paresMin)o.push("Poucos pares ("+a.pares+"). O ideal aqui é "+I.paresMin+" a "+I.paresMax+" — troque um ímpar por um par.");
  if(a.pares>I.paresMax)o.push("Pares demais ("+a.pares+"). O ideal aqui é "+I.paresMin+" a "+I.paresMax+" — troque um par por um ímpar.");
  if(a.pop>I.popGood){const mp=[...g].sort((x,y)=>POP_LOTO[y]-POP_LOTO[x])[0],t=ex(livre());o.push("Jogo popular — muita gente joga parecido. Trocar o "+mp+" pelo "+t+" reduz a divisão do prêmio.");}
  if(a.nFrias>I.friasMax)o.push("Você tem "+a.nFrias+" números que andam saindo pouco. Deixe no máximo "+I.friasMax+" — troque 1 ou 2 por mais comuns.");
  if(a.nQuent<I.quentMin){const q=L.quentes.filter(n=>!g.includes(n)).slice(0,4);o.push("Poucos números em alta. Incluir alguns equilibra: "+q.join(", ")+".");}
  if(a.nQuent>I.quentMax)o.push("Muitos números em alta ("+a.nQuent+"). Deixe entre "+I.quentMin+" e "+I.quentMax+".");
  if(a.nAtras===0){const at=L.atrasadas.filter(n=>!g.includes(n)).slice(0,3);o.push("Vale incluir 1 atrasada"+(at.length?": "+at.join(", "):"")+".");}
  if(a.cons>I.consMax)o.push("Muitos números em sequência ("+a.cons+" pares colados). Quebre algumas sequências.");
  if(!inR(a.primos,I.primosMin,I.primosMax))o.push("Primos fora do ideal ("+a.primos+"). O bom aqui é "+I.primosMin+" a "+I.primosMax+" (primos: 2,3,5,7,11,13,17,19,23).");
  if(!inR(a.mult3,I.mult3Min,I.mult3Max))o.push("Múltiplos de 3 fora do ideal ("+a.mult3+"). O bom aqui é "+I.mult3Min+" a "+I.mult3Max+" (3,6,9,12,15,18,21,24).");
  if(!inR(a.moldura,I.molduraMin,I.molduraMax))o.push("Distribuição entre bordas e centro do volante desequilibrada — espalhe melhor pelas 25.");
  if(a.linhas>I.linhasMax)o.push("Muitos números na mesma linha do volante ("+a.linhas+"). Espalhe entre as 5 linhas.");
  if(a.cols>I.colsMax)o.push("Muitos números na mesma coluna do volante ("+a.cols+"). Espalhe entre as 5 colunas.");
  return o;
}

async function doSignup(msg,btn){

  if(error){btn.disabled=false;btn.textContent="Criar conta";msg.className="msg err";msg.textContent=traduzErro(error.message);return;}

  }

  // validador — roda em QUALQUER quantidade (faixas ideais ajustam à qtd de dezenas)
  const a=g.analyze(sel,g.listas),sugs=g.suggest(a,g.listas);
  const head=el("div","resHead");
  head.appendChild(node(`<div><p class="eyebrow">Avaliação do jogo${isBase?"":" — "+sel.length+" dezenas"}</p><p class="aval" style="color:${avalColor(a.aval)}">${a.aval}</p></div>`));
  head.appendChild(ringEl(a.score));p.appendChild(head);
  const chips=el("div","chips");
  a.checks.forEach(([k,v,ok])=>{const c=el("div","chip"+(ok?"":" bad"));
    c.innerHTML=`<span class="k"><span class="mk" style="color:${ok?'var(--accentHi)':'var(--amber)'}">${ok?'✓':'!'}</span><span class="tx">${k}</span></span><span class="v" style="color:${ok?'var(--text)':'var(--amber)'}">${v}</span>`;chips.appendChild(c);});
  p.appendChild(chips);
  if(sugs.length){const sb2=el("div","sugbox");sb2.appendChild(node(`<p class="t">Como deixar o jogo melhor</p>`));
    sb2.appendChild(node(`<p class="hint" style="margin:5px 0 0">Opcional. Não muda sua chance de ganhar — só deixa o jogo mais variado e, se sair, com menos gente dividindo.</p>`));
    const ul=el("ul");sugs.forEach(s=>ul.appendChild(el("li",null,escapeHtml(s))));sb2.appendChild(ul);p.appendChild(sb2);}
  else p.appendChild(el("p","okmsg","Jogo bem equilibrado! Pode confirmar."));
  p._payload={score:a.score,aval:a.aval};

  const conf=el("button","btn primary full","Confirmar jogo");conf.style.marginTop="16px";conf.id="btnConf";
  conf.onclick=()=>confirmar(p._payload);
  p.appendChild(conf);p.appendChild(node(`<p class="msg" id="confMsg"></p>`));
  box.appendChild(p);
}
async function confirmar(pl){
  const g=GAMES[gameId],msg=$("#confMsg"),b=$("#btnConf");
  if(sel.length<g.base)return;
  b.disabled=true;b.textContent="Enviando…";msg.textContent="";msg.className="msg";
  try{
    const {error}=await sb.from("jogos").insert({
      user_id:session.user.id, nome:perfil.nome, jogo:g.id, data:aDate,
      dezenas:sel.map(p2).join("-"), qtd:sel.length, score:pl.score, aval:pl.aval });
    if(error)throw error;
    b.textContent="✓ Enviado";msg.className="msg ok";msg.textContent="Jogo registrado! Pode fazer outro.";
    toast("Jogo enviado");
    setTimeout(()=>{sel=[];syncCells();renderResult();},700);
  }catch(e){b.disabled=false;b.textContent="Confirmar jogo";msg.className="msg err";msg.textContent="Não consegui enviar. Confira a internet e tente de novo.";}
}

/* ---------- PAINEL ADMIN ---------- */
let admFiltroData="", admFiltroJogo="";
function adminView(){
  const box=el("div","stack");
  box.appendChild(node('<div id="adminJogos"></div>'));
  // roda no próximo tick: só aí o #adminJogos já está anexado ao documento
  setTimeout(()=>carregarJogosAdmin(true),0);
  return box;
}
async function carregarJogosAdmin(refill){
  const c=$("#adminJogos");if(!c)return;c.innerHTML=`<div class="panel p16"><p class="hint">Carregando jogos…</p></div>`;
  try{
    let q=sb.from("jogos").select("*").order("data",{ascending:true}).order("id",{ascending:true});
    if(admFiltroData)q=q.eq("data",admFiltroData);
    if(admFiltroJogo)q=q.eq("jogo",admFiltroJogo);
    const {data,error}=await q;if(error)throw error;
    let datas=[];
    if(refill){const {data:all}=await sb.from("jogos").select("data");datas=[...new Set((all||[]).map(j=>j.data))].sort();}
    c.innerHTML="";
    // filtros
    const fcard=el("div","panel p12");const fr=el("div","grid2");
    const sd=el("select");sd.innerHTML=`<option value="">Todas as datas</option>`+ (refill?datas:lastDatas).map(d=>`<option value="${d}">${fmtBR(d)}</option>`).join("");
    if(refill)lastDatas=datas; sd.value=admFiltroData;sd.onchange=e=>{admFiltroData=e.target.value;carregarJogosAdmin(false);};
    const sg=el("select");sg.innerHTML=`<option value="">Mega + Lotofácil</option><option value="mega">Só Mega-Sena</option><option value="lotofacil">Só Lotofácil</option>`;
    sg.value=admFiltroJogo;sg.onchange=e=>{admFiltroJogo=e.target.value;carregarJogosAdmin(false);};
    fr.append(wrapFld("Data",sd),wrapFld("Jogo",sg));fcard.appendChild(fr);c.appendChild(fcard);

    if(!data.length){c.appendChild(node(`<div class="panel empty" style="margin-top:14px"><p class="big2">Nenhum jogo ${admFiltroData||admFiltroJogo?"com esse filtro":"ainda"}.</p><p class="small">Os jogos confirmados aparecem aqui.</p></div>`));return;}
    // agrupa por data, depois por jogo
    const grp={};data.forEach(j=>{(grp[j.data]=grp[j.data]||[]).push(j);});
    Object.keys(grp).sort().forEach(dt=>{
      const lista=grp[dt],card=el("div","panel grp");
      const gh=el("div","grpHead");gh.innerHTML=`<span class="d">${fmtBR(dt)}</span>`;
      const right=el("div","row gap12");right.style.alignItems="center";
      right.appendChild(node(`<span class="hint" style="font-family:var(--mono)">${lista.length}</span>`));
      const cp=el("button","link","Copiar");
      cp.onclick=()=>copyText("🎰 "+fmtBR(dt)+"\n"+lista.map((j,i)=>(i+1)+") ["+(j.jogo==="mega"?"MEGA":"LOTO")+"] "+j.nome+": "+j.dezenas).join("\n"));
      right.appendChild(cp);gh.appendChild(right);card.appendChild(gh);
      lista.forEach(j=>{const r=el("div","jrow");
        r.innerHTML=`<div style="min-width:0"><p class="nm">${escapeHtml(j.nome||"—")} <span class="tag">${j.jogo==="mega"?"Mega":"Loto"}${j.qtd>(j.jogo==="mega"?6:15)?" "+j.qtd:""}</span></p><p class="dz">${j.dezenas}</p></div>`;
        const rt=el("div","row gap12");rt.style.alignItems="center";
        if(j.score!=null)rt.appendChild(node(`<span class="v" style="font-family:var(--mono);color:${scoreColor(j.score)}">${j.score}</span>`));
        const rm=el("button","rm","remover");rm.onclick=async()=>{try{const {error}=await sb.from("jogos").delete().eq("id",j.id);if(error)throw error;toast("Removido");carregarJogosAdmin(false);}catch(e){toast("Falhou");}};
        rt.appendChild(rm);r.appendChild(rt);card.appendChild(r);});
      c.appendChild(card);
    });
  }catch(e){c.innerHTML=`<div class="panel empty"><p class="big2">Não consegui carregar os jogos</p></div>`;}
}
let lastDatas=[];
function wrapFld(lab,inputEl){const l=el("label","fld");l.innerHTML=`<span class="lab">${lab}</span>`;l.appendChild(inputEl);return l;}

spawnCoins();
boot();
